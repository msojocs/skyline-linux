name: Build and Publish

# Builds the Linux Skyline addons on every push to master and publishes a
# complete archive as a rolling `preview` prerelease; a `v*` tag publishes a
# normal release.
#
# The 20-30 GB Flutter engine checkout is not built on CI.  The pinned prebuilt
# release engine and app bundle are downloaded from the `build-deps` release and
# used to link skyline.node and to package the archive.  Rebuild that deps
# release when the engine or the AOT bundle changes.

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install patchelf
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Restore prebuilt engine and bundle
        run: |
          set -euo pipefail
          mkdir -p native/engine/out/linux-x64-release \
                   native/engine/work/skyline-app/build
          curl -fL --retry 3 -o /tmp/skyline-deps.tar.gz \
            https://github.com/msojocs/skyline-linux/releases/download/build-deps/skyline-linux-deps-linux-x64.tar.gz
          rm -rf /tmp/skyline-deps
          mkdir -p /tmp/skyline-deps
          tar -xzf /tmp/skyline-deps.tar.gz -C /tmp/skyline-deps
          cp -a /tmp/skyline-deps/engine/. native/engine/out/linux-x64-release/
          cp -a /tmp/skyline-deps/bundle/. native/engine/work/skyline-app/build/

      - name: Build native modules
        run: |
          npm run native:build
          npm run native:build:release

      - name: Run tests
        run: npm test

      - name: Package artifacts
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            label="${GITHUB_REF_NAME}"
          else
            label="preview"
          fi
          stage=dist/package
          mkdir -p "$stage"
          cp native/build-release/skyline.node native/build-release/sharedMemory.node "$stage/"
          cp native/engine/out/linux-x64-release/libflutter_engine.so \
             native/engine/out/linux-x64-release/icudtl.dat "$stage/"
          ln -sfn libflutter_engine.so "$stage/libskyline.so"
          cp -a native/engine/work/skyline-app/build "$stage/bundle"
          rm -f "$stage/bundle/flutter_assets/kernel_blob.bin"
          cp native/engine/out/linux-x64-release/icudtl.dat "$stage/bundle/icudtl.dat"
          patchelf --set-rpath '$ORIGIN' "$stage/skyline.node" "$stage/libflutter_engine.so"
          {
            echo "skyline-linux full artifacts"
            echo "ref=${GITHUB_REF}"
            echo "commit=${GITHUB_SHA}"
            echo "node=$(node --version)"
            echo "engine=deps:build-deps"
          } > "$stage/BUILD-INFO.txt"
          archive="dist/skyline-linux-${label}-linux-x64.tar.gz"
          tar -czf "$archive" -C "$stage" .
          (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          echo "archive=$archive" >> "$GITHUB_ENV"

      - name: Remove previous preview release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The preview is a rolling release, so replace both the release and
          # the tag with a fresh one pointing at this commit.
          gh release delete preview --yes --cleanup-tag || true
          git push origin :refs/tags/preview || true

      - name: Publish preview release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          target_commitish: ${{ github.sha }}
          name: Preview ${{ github.sha }}
          body: |
            Rolling preview build from `master`.
            Commit: `${{ github.sha }}`
          prerelease: true
          files: |
            dist/*.tar.gz
            dist/*.sha256

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
